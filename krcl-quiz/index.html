// Lessons for Part 1. Format: [concept, method, exam tip]
L.push(
["MTU is the largest IP packet a link can carry. MSS is the largest chunk of application data TCP puts in one segment, i.e. what is left after the IP and TCP headers.","MSS = MTU − IP header − TCP header. Minimum headers: IPv4 = 20 bytes, TCP = 20 bytes, IPv6 = 40 bytes. Add any option bytes (e.g. TCP timestamps +12).","Ethernet MTU = 1500 → MSS 1460 (IPv4) or 1440 (IPv6). Header maximums: IPv4 60 bytes (HLEN × 4), TCP 60 bytes. Don't confuse MTU with the Ethernet frame size (1518 bytes including the 14-byte header and 4-byte FCS)."],
["Routing protocols come in three families. Distance-vector protocols share whole routing tables with neighbours. Link-state protocols flood link information so every router builds a full map. Path-vector protocols share whole AS paths.","Link-state (OSPF, IS-IS) → Dijkstra/SPF. Distance-vector (RIP) → Bellman-Ford. Path-vector (BGP) → policy-based. EIGRP is advanced distance-vector and uses DUAL.","OSPF: cost metric, areas (backbone = Area 0), IP protocol 89, hello 10 s. RIP: hop count, max 15 (16 = unreachable), updates every 30 s, UDP 520. BGP: TCP 179, used between ISPs/ASes."],
["Two kinds of address work together: a logical IP address (Layer 3) to reach the right network, and a physical MAC address (Layer 2) to deliver the frame on the local link. ARP connects the two.","The host broadcasts 'Who has 192.168.1.5?' (destination MAC FF:FF:FF:FF:FF:FF). The owner replies by unicast with its MAC, and the result is cached in the ARP table.","RARP does the reverse (MAC → IP) and is obsolete; DHCP replaced it. IPv6 has no ARP and uses NDP (Neighbour Discovery). Commands: 'arp -a'. Gratuitous ARP announces your own IP to detect conflicts."],
["A subnet mask splits a 32-bit IPv4 address into network bits and host bits. The prefix length /n says how many bits are network bits.","Host bits h = 32 − n. Total addresses = 2^h. Usable hosts = 2^h − 2 (remove the network and broadcast addresses). Block size = 256 − last non-255 octet of the mask (here 256 − 224 = 32).","Memorise: /24 → 254, /25 → 126, /26 → 62, /27 → 30, /28 → 14, /29 → 6, /30 → 2 (point-to-point links). Number of subnets from borrowing b bits = 2^b."],
["The OSI model has 7 layers, each with one job. From the top: Application, Presentation, Session, Transport, Network, Data Link, Physical.","Match the keyword to the layer. Format, encryption, compression → Presentation. Dialogue control, checkpoints → Session. End-to-end delivery, ports → Transport. Routing, IP → Network. Framing, MAC → Data Link. Bits, signals → Physical.","Mnemonic, top to bottom: 'All People Seem To Need Data Processing'. Data units: segment (L4), packet (L3), frame (L2), bits (L1). Devices: router L3, switch L2, hub/repeater L1."],
["On a shared cable only one station can transmit at a time. Media access control protocols decide who talks when and what to do when two talk at once.","CSMA/CD: (1) listen until the channel is idle, (2) transmit, (3) if a collision is detected, send a jam signal, (4) wait a random binary-exponential backoff time and retry.","CSMA/CD = wired Ethernet (detects collisions). CSMA/CA = Wi-Fi 802.11 (avoids collisions, since radios can't detect them while sending). Full-duplex switched Ethernet has no collisions, so CSMA/CD isn't needed there."],
["The transport layer offers two models. TCP is connection-oriented and reliable. UDP is connectionless and best-effort.","TCP: 3-way handshake (SYN, SYN-ACK, ACK), sequence numbers, ACKs, retransmission, flow and congestion control, 20-byte header. UDP: no handshake, no ordering, 8-byte header.","UDP users: DNS (53), DHCP (67/68), TFTP (69), SNMP (161), VoIP/RTP, streaming. TCP users: HTTP, HTTPS, FTP (20/21), SSH (22), SMTP (25)."],
["The bandwidth-delay product is how many bits are 'in flight' on a link at once, i.e. the size of the pipe. It sets how big the TCP window must be to keep the link fully used.","BDP = bandwidth (bit/s) × RTT (s). Convert ms to s (÷1000) and Mbps to bit/s (×10⁶). Divide by 8 for bytes.","Questions may use one-way delay instead of RTT, so read carefully. Link utilisation with stop-and-wait = 1/(1 + 2a), where a = propagation time / transmission time."],
["The TCP/IP model has 4 layers that map onto the 7 OSI layers.","Application (OSI 5–7) → Transport (OSI 4) → Internet (OSI 3) → Network Access/Link (OSI 1–2).","Some books show a 5-layer hybrid that splits the link layer into Data Link and Physical. Internet-layer protocols: IP, ICMP, ARP (sometimes placed at L2), IGMP."],
["Well-known ports (0–1023) identify standard services so a client knows where to connect.","Learn them in groups: web 80/443, mail 25 (SMTP), 110 (POP3), 143 (IMAP), file transfer 20/21 (FTP), 69 (TFTP), remote access 22 (SSH), 23 (Telnet), 3389 (RDP), name/IP services 53 (DNS), 67/68 (DHCP).","Registered ports run 1024–49151 and dynamic ports 49152–65535. 8080 is a common alternate HTTP port. HTTPS = HTTP + TLS."],
["Normalisation removes redundancy by splitting tables according to functional dependencies (X → Y means X determines Y).","1NF: atomic values. 2NF: 1NF + no partial dependency (non-key attribute depending on part of a composite key). 3NF: 2NF + no transitive dependency (key → A → B). BCNF: every determinant is a candidate key.","Spot the type: 'part of the key' → 2NF problem; 'non-key determines non-key' → 3NF problem. 4NF removes multivalued dependencies, 5NF removes join dependencies."],
["ACID describes the guarantees of a reliable transaction.","Atomicity: all or nothing (undo log). Consistency: constraints hold before and after. Isolation: concurrent transactions don't interfere (locks/MVCC). Durability: committed data survives crashes (redo log / write-ahead log).","Isolation levels from weakest: Read Uncommitted → Read Committed → Repeatable Read → Serializable. Each step removes one anomaly: dirty read, then non-repeatable read, then phantom."],
["SQL commands fall into groups: DDL (structure: CREATE, ALTER, DROP, TRUNCATE), DML (data: SELECT, INSERT, UPDATE, DELETE), DCL (GRANT, REVOKE) and TCL (COMMIT, ROLLBACK, SAVEPOINT).","DELETE: DML, supports WHERE, fires triggers, logs each row. TRUNCATE: DDL, no WHERE, removes all rows quickly, resets identity. DROP: removes the table structure itself.","Order of 'damage': DELETE (rows) < TRUNCATE (all rows, keeps structure) < DROP (table gone). In Oracle, TRUNCATE auto-commits and can't be rolled back."],
["Relational algebra is the mathematical basis of SQL queries.","σ (selection) = WHERE (filters rows). π (projection) = SELECT column list (filters columns). ⋈ = JOIN. ∪, ∩, − = UNION, INTERSECT, EXCEPT. × = Cartesian product. ρ = rename.","Trap: SQL's SELECT keyword is projection (π), not selection (σ). Union and intersection require union-compatible relations (same number and type of columns)."],
["Indexes speed up lookups, usually using B+ trees.","Clustered index: the table rows are stored in index order, so the leaf level is the data (one per table, often the primary key). Non-clustered index: leaves hold pointers to the rows (many allowed).","Dense index: an entry for every record. Sparse index: entries only for some (needs sorted data). B+ trees keep all data in leaves linked for range scans; B-trees store data in internal nodes too."],
["Joins combine rows from two tables on a matching condition.","INNER: only matching rows. LEFT: all left rows plus matches. RIGHT: all right rows plus matches. FULL: all rows from both. CROSS: every combination (m × n rows). SELF: a table joined to itself.","Row-count questions: a CROSS JOIN of 3 rows and 4 rows gives 12. LEFT JOIN returns at least as many rows as the left table. A NATURAL JOIN matches on columns with the same name."],
["Concurrency anomalies happen when transactions overlap.","Dirty read: reading uncommitted data. Non-repeatable read: the same row returns different values (someone UPDATEd it). Phantom: the same query returns new or missing rows (someone INSERTed or DELETEd).","Which level fixes which: Read Committed stops dirty reads; Repeatable Read also stops non-repeatable reads; Serializable also stops phantoms. Lost update and write skew are other anomalies."],
["DCL (Data Control Language) manages who may do what in the database.","GRANT privilege ON object TO user [WITH GRANT OPTION]; REVOKE privilege ON object FROM user. Privileges include SELECT, INSERT, UPDATE, DELETE and EXECUTE.","WITH GRANT OPTION lets the user pass the privilege on. Revoking it can cascade. TCL (COMMIT/ROLLBACK) is a different group, so don't mix them up."],
["QuickSelect is QuickSort's cousin: partition around a pivot, but recurse into only the side that contains the k-th element.","Each step roughly halves the work: N + N/2 + N/4 + … ≈ 2N, so O(N) on average. With bad pivots (e.g. already sorted, first-element pivot) it is O(N²).","Median of medians gives a guaranteed O(N) worst case. Compare: QuickSort O(N log N) average / O(N²) worst; MergeSort O(N log N) always; HeapSort O(N log N), in place."],
["A stack is LIFO (last in, first out). It suits nested or reversed processing.","Postfix evaluation: scan left to right; push operands; on an operator, pop B then A, compute A op B, push the result. The final stack value is the answer. Infix → postfix conversion also uses a stack (for operators).","Other stack uses: recursion and function calls, undo, bracket matching, DFS. Queue (FIFO) uses: BFS, scheduling, buffers. Prefix (Polish) expressions are evaluated by scanning right to left."],
["Traversal costs depend on how much has to be remembered at once.","DFS goes deep, so its stack holds one path: O(depth). BFS goes wide, so its queue holds one level: O(width), up to O(V). Both take O(V + E) time with an adjacency list, or O(V²) with a matrix.","DFS: topological sort, cycle detection, connected components. BFS: shortest path in an unweighted graph. Dijkstra (non-negative weights) uses a priority queue."],
["An AVL tree is a self-balancing BST in which subtree heights differ by at most 1 at every node, keeping height O(log N).","Balance factor = h(left) − h(right). After an insert, if some node reaches ±2, rotate: LL → single right rotation; RR → single left; LR → left then right; RL → right then left.","All AVL operations are O(log N). Red-black trees are less strictly balanced (fewer rotations). Minimum nodes in an AVL tree of height h: N(h) = N(h−1) + N(h−2) + 1."],
["A hash table maps keys to slots with h(k) mod M. A collision happens when two keys land in the same slot.","Chaining: each slot holds a list. Open addressing finds another slot: linear probing h + i, quadratic probing h + i², double hashing h₁ + i·h₂.","Linear probing → primary clustering. Quadratic → secondary clustering. Double hashing has the least clustering. Load factor α = n/M; keep α < 0.7 for open addressing."],
["A binary heap is a complete binary tree stored in an array. In a max-heap every parent ≥ its children.","Array indexing (0-based): children at 2i+1 and 2i+2, parent at (i−1)/2. Insert: add at the end and sift up, O(log N). Delete max: move the last element to the root and sift down, O(log N). Build a heap: O(N).","Peek max/min is O(1). Heap sort is O(N log N) and not stable. Priority queues are built on heaps (Dijkstra, Prim)."],
["A deadlock is a set of processes each waiting for a resource another one holds, so none can proceed.","All four must hold: mutual exclusion, hold and wait, no preemption, circular wait. Handling strategies: prevention (break a condition), avoidance (Banker's algorithm keeps the system in a safe state), detection and recovery, or ignoring it (the ostrich approach).","Ordering resources numerically breaks circular wait. Resource allocation graph: with single-instance resources, a cycle means deadlock; with multiple instances, a cycle means it is only possible."],
["A process is a program in execution with its own memory. Threads are execution paths inside one process.","Threads share code, data, heap and open files, but each has its own stack, registers and program counter. Thread switches are cheaper, and threads communicate through shared memory.","User-level threads are managed by a library (fast, but one block blocks all). Kernel-level threads are managed by the OS. Process states: New → Ready → Running → Waiting → Terminated."],
["With virtual memory, only the needed pages are kept in RAM. If the active pages (the working set) don't fit, the system pages constantly.","Symptom: high page-fault rate, low CPU utilisation. The OS sees idle CPU and admits more processes, which makes it worse. Fixes: working-set model, page-fault-frequency control, reducing the degree of multiprogramming.","Page replacement: FIFO (suffers Belady's anomaly, where more frames can mean more faults), LRU, Optimal (theoretical best). Belady's anomaly can't happen with LRU or Optimal."],
["Scheduling algorithms decide which ready process runs next. Key formulas: turnaround = completion − arrival; waiting = turnaround − burst.","Practise with a Gantt chart. FCFS: by arrival (convoy effect). SJF: shortest burst first, optimal average waiting time. SRTF: preemptive SJF. Round Robin: time quantum, good response time. Priority: may starve low priority (fixed by aging).","SJF/SRTF can starve long jobs. Round Robin with a very large quantum becomes FCFS. Always draw the Gantt chart before computing averages."],
["Paging translates virtual page numbers into physical frames using a page table in RAM, which normally costs an extra memory access.","Effective access time = h × (TLB + mem) + (1 − h) × (TLB + 2 × mem), where h is the TLB hit ratio.","Example: TLB 20 ns, memory 100 ns, hit ratio 80% → 0.8(120) + 0.2(220) = 140 ns. Page size is always a power of 2. Logical address = page number + offset."],
["Optical fibre loss and dispersion depend on wavelength. Three 'windows' have low loss.","1st window 850 nm (multimode, short links, ~3 dB/km). 2nd window 1310 nm (zero dispersion, ~0.35 dB/km). 3rd window 1550 nm (lowest loss, ~0.2 dB/km, works with EDFA amplifiers).","Single-mode core ≈ 8–10 µm; multimode 50/62.5 µm; cladding 125 µm. Lasers drive single-mode fibre; LEDs drive multimode. Fibre is immune to EMI, which is why railways use it along 25 kV lines."],
["Block working keeps trains apart by distance (space interval), not by time.","Absolute Block: a block section between two stations may hold only one train. The rear station must get 'Line Clear' from the station ahead, given on block instruments or a token (single line). Automatic Block: track circuits and automatic signals split the section into several shorter blocks.","Related terms: block section, block overlap (usually 180 m beyond the first stop signal), token/tablet for single lines, Line Clear, Train Out of Section."],
["Signalling cables run beside 25 kV AC electrified tracks, which induce voltages and noise.","Quad cable: four conductors twisted in a star so pairs cancel interference. Armour and screening give protection. Railways use quad cable for block and telephone circuits, signalling cable for points and signals, and OFC for data.","Parts of 25 kV AC traction: OHE (overhead equipment), TSS (traction substation), catenary and contact wire. DC traction is 1500 V (old Mumbai) or 750 V (metros, third rail)."],
["Train detection tells the interlocking whether a track section is occupied.","Axle counter: sensors at each end count axles in and out. Equal counts → clear; unequal → occupied. Track circuit: the train's wheels short the rails, de-energising a relay that shows 'occupied' (fail-safe).","Track circuits also detect broken rails; axle counters don't. Axle counters suit long sections, yards with poor ballast, and flooded or rusty rails. Block Proving by Axle Counter (BPAC) automates the 'train out of section' check."],
["Multiplexing hierarchies combine many channels onto one fibre.","PDH: E1 = 2.048 Mbps (32 × 64 kbps). SDH: STM-1 = 155.52 Mbps, STM-4 = 622 Mbps, STM-16 ≈ 2.5 Gbps, STM-64 ≈ 10 Gbps (×4 each step). SONET is the US equivalent (OC-3 = STM-1).","SDH ring protection switches in under 50 ms. Railway telecom on OFC carries control phones, SCADA, PRS, UTS, FOIS and CCTV. RailTel is the PSU that runs the railway OFC network."],
["Automatic Train Protection (ATP) supervises the loco pilot and brakes automatically if limits are broken.","Kavach compares the train's speed and position with signal aspects and speed limits (using RFID tags on the track, a radio link to the station unit and on-board computers). It warns first, then applies brakes. It also prevents head-on and rear-end collisions.","Kavach was developed by RDSO with Indian industry and is certified to SIL-4 (the highest safety integrity level). Related: TCAS (its earlier name), ETCS (European system), TPWS."],
["Light refracts when it crosses media of different refractive index. Above the critical angle it reflects completely.","Critical angle θc = sin⁻¹(n₂/n₁), with n₁ (core) > n₂ (cladding). Numerical aperture NA = √(n₁² − n₂²) sets the acceptance angle.","TIR also explains a diamond's sparkle and mirages. Larger NA means more light is accepted but more modal dispersion. Step-index and graded-index fibres differ in how n changes across the core."],
["Number base conversions use grouping. 4 binary bits = 1 hex digit; 3 bits = 1 octal digit.","Binary → hex: group 4 bits from the right, convert each (1010 = A … 1111 = F). Hex → binary: expand each digit to 4 bits. Decimal → any base: repeatedly divide and read the remainders bottom-up.","Check: D6₁₆ = 13 × 16 + 6 = 214₁₀. 2's complement = invert the bits and add 1. BCD stores each decimal digit in 4 bits."],
["Power amplifier classes are defined by the conduction angle, i.e. how much of the cycle the transistor conducts.","Class A: 360°, max efficiency 25% (resistive load) or 50% (transformer coupled), least distortion. Class B: 180°, 78.5% (π/4), crossover distortion. Class AB: between A and B, reduces crossover distortion. Class C: < 180°, over 90%, used for RF tuned amplifiers.","Push-pull uses two Class B transistors. Class D is a switching amplifier (PWM) with very high efficiency."],
["Boolean algebra simplifies logic circuits. De Morgan's laws turn ANDs into ORs and back.","(A·B)' = A' + B' (a NAND equals an OR with inverted inputs). (A + B)' = A'·B' (a NOR equals an AND with inverted inputs). Rule: break the bar, change the sign.","NAND and NOR are universal gates (any circuit can be built from either). Useful laws: A + A'B = A + B; A + AB = A (absorption); XOR = A'B + AB'."],
["An op-amp with negative feedback gives circuits whose output depends on the feedback components.","Inverting amp: gain = −Rf/Rin. Non-inverting: 1 + Rf/Rin. Integrator: capacitor in feedback, Vout = −(1/RC)∫Vin dt. Differentiator: capacitor at the input, Vout = −RC dVin/dt. Voltage follower: gain 1 (buffer).","An ideal op-amp has infinite input impedance, zero output impedance and infinite open-loop gain, and creates a virtual ground at the inverting input. A square-wave input to an integrator gives a triangle-wave output."],
["A multiplexer selects one of several inputs to send to a single output, using select lines.","A 2ⁿ × 1 MUX needs n select lines. A demultiplexer is the reverse (1 → 2ⁿ outputs). A decoder turns n inputs into 2ⁿ outputs (one active). An encoder turns 2ⁿ inputs into n outputs.","Building large muxes: a 16:1 from 4:1 muxes needs 4 + 1 = 5. A MUX can implement any Boolean function: a 2ⁿ:1 MUX handles n variables (or n+1 with an inverter)."],
["Flip-flops are 1-bit memory elements. The JK flip-flop fixes the SR's invalid state, but J = K = 1 toggles, which can repeat many times within a long clock pulse (race-around).","JK truth table: 00 hold, 01 reset, 10 set, 11 toggle. Fixes: master-slave arrangement, edge triggering, or making the pulse shorter than the propagation delay.","T flip-flop = JK with J = K (toggle). D flip-flop = JK with K = J' (data latch). The excitation table matters for counter design. A mod-N counter needs ⌈log₂N⌉ flip-flops."],
["A bus's width sets how much memory can be addressed (address bus) and how much data moves per transfer (data bus).","Addressable memory = 2^(address lines). 8085: 16 address lines (A0–A7 multiplexed with D0–D7 as AD0–AD7), 8-bit data, 40 pins, 3 MHz, 5 V. 8086: 20 address lines (1 MB), 16-bit data.","8085 interrupts: TRAP (non-maskable, highest priority), RST 7.5, RST 6.5, RST 5.5, INTR. ALE separates address from data. Flags: S, Z, AC, P, CY."],
["An interrupt pauses the current program to run an Interrupt Service Routine (ISR), then returns.","Sequence: finish the current instruction → push PC (and on many CPUs the flags) onto the stack → load the ISR address (vector) → run the ISR → RET/RETI pops PC → resume.","Maskable interrupts can be disabled (EI/DI in the 8085); non-maskable (TRAP/NMI) can't. Vectored interrupts have fixed addresses, e.g. 8085 RST n at n × 8 (RST 7.5 → 003CH). The stack grows downwards in the 8085."],
["SDLC models suit different projects. Pick based on how stable the requirements are and how much risk there is.","Waterfall: sequential, stable requirements. V-Model: waterfall with a test phase matched to each development phase (requirements ↔ acceptance test, design ↔ integration test, code ↔ unit test). Spiral: risk-driven. Agile: iterative, changing requirements. Prototype: unclear requirements.","Safety standards for railways: EN 50128 (software) and EN 50129 (safety), SIL 0–4. Spiral was proposed by Boehm. RAD = Rapid Application Development."],
["OOP has four pillars: encapsulation, abstraction, inheritance and polymorphism.","Compile-time polymorphism: method overloading (same name, different parameters). Runtime polymorphism: method overriding (a subclass redefines a parent method, chosen through dynamic dispatch / virtual functions).","Encapsulation = bundling data with methods and hiding it (private fields). Abstraction = showing only essentials (abstract classes, interfaces). Inheritance = 'is-a'; composition = 'has-a'."],
["Process-maturity models measure how disciplined an organisation's software process is.","CMMI levels: 1 Initial (chaotic), 2 Managed (projects planned), 3 Defined (organisation-wide standards), 4 Quantitatively Managed (measured), 5 Optimizing (continuous improvement).","CMMI was developed at SEI, Carnegie Mellon. ISO 9001 is the general quality standard. Six Sigma targets 3.4 defects per million. Remember the level order: I-M-D-Q-O."],
["The CPU runs a fetch–decode–execute cycle using special registers.","PC: address of the next instruction. IR: the current instruction. MAR: the memory address being accessed. MDR/MBR: the data being read or written. SP: top of the stack. ACC: ALU results.","Fetch: MAR ← PC; MDR ← Memory[MAR]; IR ← MDR; PC ← PC + 1. A branch or jump loads a new value into the PC."],
["Git tracks snapshots, and branches are movable pointers to commits.","Common commands: init, clone, add (stage), commit, status, log, branch, checkout/switch, merge, rebase, pull (= fetch + merge), push, stash, revert (new undo commit), reset (move HEAD).","Merge keeps history and may create a merge commit. Rebase rewrites history into a straight line. A fast-forward merge just moves the pointer. Conflicts are marked with <<<<<<< ======= >>>>>>>."],
["Testing techniques differ by how much of the code the tester can see.","Black box (behaviour only): equivalence partitioning, boundary value analysis, decision tables, state transitions. White box (code visible): statement, branch and path coverage, cyclomatic complexity. Grey box mixes both.","Testing levels: unit → integration → system → acceptance (alpha in-house, beta at the customer). Cyclomatic complexity V(G) = E − N + 2 = number of decisions + 1. Regression testing re-checks old features after changes."]

// Lessons for Part 2
L.push(
["Multiples of a number form an arithmetic progression (AP) with common difference equal to that number.","Find the first and last multiple in the range. Number of terms n = (last − first)/d + 1. Sum = n/2 × (first + last).","Shortcut: count of multiples of k from 1 to N = ⌊N/k⌋. Two-digit multiples of 7 = ⌊99/7⌋ − ⌊9/7⌋ = 14 − 1 = 13. Also learn Sₙ = n/2[2a + (n−1)d] and the sum of the first n naturals = n(n+1)/2."],
["Only the unit digit of the base affects the unit digit of a power, and unit digits repeat in cycles.","Find the remainder r = power mod 4 (if r = 0, use 4) and raise the last digit to r. Cycles: 2 → 2,4,8,6; 3 → 3,9,7,1; 7 → 7,9,3,1; 8 → 8,4,2,6; 4 → 4,6 (odd/even power); 9 → 9,1. Digits 0, 1, 5, 6 always stay the same.","For a product, multiply just the unit digits at the end. Example: 3⁶⁵ → 65 mod 4 = 1 → 3. Watch for a factor ending in 5 times an even number: the result ends in 0."],
["For any two numbers, HCF × LCM = product of the numbers.","LCM = product ÷ HCF. If the numbers are HCF × a and HCF × b with a and b coprime, then LCM = HCF × a × b.","This identity holds only for two numbers. HCF of fractions = HCF(numerators)/LCM(denominators); LCM of fractions = LCM(numerators)/HCF(denominators). The HCF always divides the LCM, a useful check for options."],
["Simplification follows BODMAS/VBODMAS: Vinculum (bar), Brackets (), {}, [] from the inside out, Of, Division, Multiplication, Addition, Subtraction.","Work the innermost bracket first, doing ÷ and × before + and − inside it. Then move outward one bracket type at a time.","Division and multiplication have equal priority, so work left to right; the same goes for + and −. 'Of' means multiply but comes before ÷: 6 ÷ 2 of 3 = 6 ÷ 6 = 1."],
["A number that leaves the same remainder r when divided by several divisors equals LCM × k + r.","LCM of the divisors → find the multiple of the LCM in the required range → add the remainder. When the remainders differ but (divisor − remainder) is the same value c, the number is LCM × k − c.","Largest n-digit version: take the largest n-digit multiple of the LCM, then add r. For prime factorisation use ladder division. Check: 1011 ÷ 28 = 36 remainder 3 ✓."],
["When price goes up, consumption must fall to keep spending fixed (spending = price × quantity).","If price rises by r%, consumption must fall by r/(100 + r) × 100%. If price falls by r%, consumption may rise by r/(100 − r) × 100%.","Fraction method: +25% = ×5/4, so quantity becomes ×4/5, i.e. −1/5 = −20%. Also works for income/expenditure and length/breadth problems with a fixed area."],
["Marked price (MP) sits above cost price (CP), and the discount comes off MP, not CP.","Assume CP = 100. MP = 100 + markup%. SP = MP × (100 − discount)/100. Profit% = SP − 100. Formula: net% = m − d − md/100 = 40 − 20 − 8 = 12%.","Profit and loss are always calculated on CP; discount is always on MP. 'Buy 4 get 1 free' = 1/5 = 20% discount."],
["When profit (or loss) is expressed as the SP or CP of some units, compare quantities directly.","Gain = SP of x units out of n sold → CP of n = SP of (n − x). Profit% = x/(n − x) × 100. If the loss equals the SP of x units → loss% = x/(n + x) × 100.","Here 11/(33 − 11) = 50%. Variant: 'CP of 20 = SP of 16' → profit = (20 − 16)/16 = 25%."],
["Successive percentage changes multiply rather than add.","Two changes a% and b% combine to a + b + ab/100 (use negative values for decreases). For discounts of 20% and 10%: −20 − 10 + 200/100 = −28%.","Multiplier method: 0.8 × 0.9 = 0.72, so 28% off. Order doesn't matter. Three discounts: apply the formula twice. A 10% rise then 10% fall = 1% net loss."],
["Sets of people failing or passing work like a Venn diagram: n(A ∪ B) = n(A) + n(B) − n(A ∩ B).","Failed in at least one = fail Maths + fail English − fail both. Passed both = 100% − failed at least one.","Variant: given the number who passed both (e.g. 500 students = 50%), total = 500/0.5 = 1000. 'Only Maths' = Maths − both."],
["To join two ratios, make the common term equal.","A:B = 3:4, B:C = 8:9. Multiply the first ratio so B matches (LCM of 4 and 8 = 8): 6:8. Then A:B:C = 6:8:9. Quick method: A:B:C = (3×8) : (4×8) : (4×9) = 24:32:36 = 6:8:9.","A:C = (A/B) × (B/C) = 3/4 × 8/9 = 2/3. Dividing an amount in ratio a:b → shares a/(a+b) and b/(a+b) of the total."],
["Average = sum ÷ count, so sum = average × count. Most average problems compare 'before' and 'after' sums.","New sum − old sum = the value added. Here: 21 × 16 − 20 × 15. Shortcut: new member = old average + (new count × increase) = 15 + 21 × 1 = 36.","If someone leaves and the average changes by d: value = old average − (new count × d). For replacing a person: new − old = count × change."],
["In mixtures, the quantity you don't add stays fixed, so anchor the calculation on it.","Milk stays at 40 L. For milk : water = 1 : 2, water must be 80 L, so add 80 − 20 = 60 L.","Alligation finds the mixing ratio: (dearer − mean) : (mean − cheaper) gives cheaper : dearer. Repeated replacement: final = initial × (1 − x/V)ⁿ."],
["Age problems: everyone ages by the same number of years, so set up the ratio with x and form an equation.","Present ages 4x and 5x. In 6 years (4x + 6)/(5x + 6) = 5/6. Cross-multiply and solve for x.","Shortcut: test the options (24, 30 → 30/36 = 5/6 ✓). The difference between two ages never changes, so the ratio-difference trick works: 5 − 4 = 1 part and 6 − 5 = 1 part."],
["When numbers are in a ratio, write them as multiples of x and use the condition.","Sum of cubes: (1³ + 2³ + 3³)x³ = 36x³. Solve x³ = 125 → x = 5. Largest = 3x.","Learn cubes up to 15 and squares up to 30. Sums: 1³ + … + n³ = [n(n+1)/2]² (here 1 + 8 + 27 = 36 = 6² ✓)."],
["Time and work: if a person finishes a job in n days, they do 1/n of it per day. Rates add up.","Work done = rate × time. Combined rate = 1/12 + 1/18 = 5/36. In 4 days: 20/36 = 5/9 done, so 4/9 remains.","LCM method: total work = LCM(12, 18) = 36 units. A = 3 units/day, B = 2, together 5. In 4 days: 20 units, leaving 16/36 = 4/9. This avoids fractions."],
["Work equivalence: if 12 men = 18 women in output, convert everyone to one unit.","1 M = 18/12 = 1.5 W. Convert the group: 8 × 1.5 + 16 = 28 W. Then M₁D₁ = M₂D₂: 18 × 14 = 28 × D.","General formula: M₁D₁H₁/W₁ = M₂D₂H₂/W₂ (H = hours per day, W = work). Use it whenever workers, days, hours or quantity of work change."],
["Pipes are like workers. Filling pipes add (+) and emptying pipes subtract (−).","Net rate = Σ fill rates − Σ empty rates. Time = 1 ÷ net rate. LCM method: tank = 60 units; A = 6, B = 4, C = −3, net 7 units/hour → 60/7 h.","If the net rate is negative, the full tank empties. A leak problem: if a tank normally fills in a hours but takes b hours with a leak, the leak alone empties it in ab/(b − a) hours."],
["Efficiency is the inverse of time: twice as efficient means half the time.","Give efficiencies as units/day (A = 2, B = 1). Total work = combined efficiency × days = 3 × 14 = 42. A alone = 42/2 = 21 days.","If A is x times as efficient as B: time ratio A:B = 1:x. Check: A = 21 days, B = 42 days → 1/21 + 1/42 = 3/42 = 1/14 ✓."],
["Wages are shared in proportion to the work each person does (equivalently, in the ratio of their daily efficiencies when they work the same number of days).","Find each person's share of the work over the 3 days: A = 3/6 = 1/2, B = 3/8, C = 1 − 1/2 − 3/8 = 1/8. C's pay = 1/8 × 600.","If people work different numbers of days, pay follows efficiency × days worked. LCM method: 24 units; A 4/day, B 3/day, all three 8/day → C = 1/day."],
["Speed in km/h converts to m/s by multiplying by 5/18 (and by 18/5 to go back).","A train crossing a pole, person or post covers its own length: Length = speed × time.","Learn these: 36 km/h = 10 m/s, 54 = 15, 72 = 20, 90 = 25, 108 = 30. Distance = speed × time; keep units consistent."],
["Relative speed: opposite directions → add speeds; same direction → subtract.","Two trains crossing each other cover the sum of their lengths. Time = (L₁ + L₂)/relative speed.","Same direction: (60 − 48) × 5/18 = 10/3 m/s → 300/(10/3) = 90 s. A train passing a moving person: use the relative speed and the train's length only."],
["A train crossing a platform, bridge or tunnel covers its own length plus the platform's length.","Distance = speed × time → L + platform = 450 m. Then a pole takes L/speed.","Shortcut: the extra time to cross the platform = platform length / speed = 150/15 = 10 s, so pole time = 30 − 10 = 20 s."],
["Boats and streams: downstream speed = boat + current; upstream = boat − current.","Boat speed = (down + up)/2. Current speed = (down − up)/2.","Round-trip time for distance d: d/(b+c) + d/(b−c). Average speed for equal distances is the harmonic mean 2xy/(x + y), not the simple average."],
["For a fixed distance, speed and time are inversely proportional.","Speed becomes 3/4, so time becomes 4/3. Extra time = 1/3 of the usual time = 20 min, so usual time = 60 min.","General: at a/b of the usual speed, the delay of x minutes means usual time = x × a/(b − a). Here 20 × 3/(4 − 3) = 60."],
["Simple interest grows by the same amount every year: SI = P × R × T / 100.","Rearrange for the unknown: P = 100 × SI/(R × T); R = 100 × SI/(P × T); T = 100 × SI/(P × R).","Amount = P + SI. Units must match: R per annum with T in years (months ÷ 12)."],
["Compound interest earns interest on interest: A = P(1 + R/100)ⁿ, CI = A − P.","For 2 years at 10%: 8000 × 1.21 = 9680. Effective 2-year rate = 2R + R²/100 = 21%.","Half-yearly compounding: rate R/2, time 2n. Effective CI rates for 2 years: 5% → 10.25%, 10% → 21%, 20% → 44%. 3 years at 10% → 33.1%."],
["The difference between CI and SI comes from the interest earned on interest.","2 years: CI − SI = P(R/100)². 3 years: CI − SI = P(R/100)²(3 + R/100).","Here 25 = P × (1/20)² → P = 10,000. Remember the 3-year version; it's a favourite."],
["With simple interest, the interest earned grows linearly with time.","Tripling means interest = 2P in 8 years. Becoming 5 times means interest = 4P, which takes twice as long: 16 years.","Formula: if a sum becomes n times in T years, it becomes m times in T × (m − 1)/(n − 1) years. With CI it's multiplicative: doubling in T years means quadrupling in 2T years."],
["Reverse compound interest: P = A ÷ (1 + R/100)ⁿ.","Recognise powers: 1.1² = 1.21, 1.1³ = 1.331, 1.1⁴ = 1.4641. 1331 = 11³ → P = 1000.","Also learn 1.05² = 1.1025, 1.2² = 1.44, 1.2³ = 1.728. When the amount looks like 11³ or 12³, the principal is usually 10³."],
["Algebraic identities save time: (x + 1/x)² = x² + 2 + 1/x².","x² + 1/x² = (x + 1/x)² − 2. If x − 1/x = k, then x² + 1/x² = k² + 2. x³ + 1/x³ = k³ − 3k.","Chain them: x + 1/x = 5 → x² + 1/x² = 23 → x⁴ + 1/x⁴ = 23² − 2 = 527. And x³ + 1/x³ = 125 − 15 = 110."],
["Cube identities: a³ + b³ = (a + b)³ − 3ab(a + b) = (a + b)(a² − ab + b²).","Plug in a + b and ab directly. For a³ − b³ = (a − b)³ + 3ab(a − b).","Also: a² + b² = (a + b)² − 2ab = 58 here. If a + b + c = 0, then a³ + b³ + c³ = 3abc."],
["A quadratic ax² + bx + c = 0 can be solved by factorisation: find two numbers that multiply to ac and add to b.","x² − 7x + 12: numbers −3 and −4 → (x − 3)(x − 4). Formula: x = [−b ± √(b² − 4ac)]/2a.","Sum of roots = −b/a (= 7), product = c/a (= 12). Use these to check options instantly. Discriminant D > 0 → two real roots; D = 0 → equal roots; D < 0 → no real roots."],
["To solve linear equations with fractions, clear the denominators first.","Multiply every term by the LCM of the denominators (here 12). Expand, collect x terms on one side and solve.","Check by substitution: x = 2.6 → (5.2 + 5)/3 − 1.6/4 = 3.4 − 0.4 = 3 ✓. Watch the sign when subtracting a bracket: −3(x − 1) = −3x + 3."],
["Laws of exponents: if a^m = a^n, then m = n (same base, a ≠ 0, 1).","Write both sides with the same base: 27 = 3³ and 243 = 3⁵. That gives two linear equations: x − y = 3 and x + y = 5. Add them.","Other laws: a^m × a^n = a^(m+n); a^m ÷ a^n = a^(m−n); (a^m)^n = a^(mn); a⁰ = 1; a^(−n) = 1/a^n. Powers of 3: 3, 9, 27, 81, 243, 729."],
["Parallel lines cut by a transversal create equal and supplementary angle pairs.","Equal: corresponding, alternate interior, alternate exterior, vertically opposite. Supplementary (sum 180°): co-interior (same-side interior) angles and a linear pair.","If one angle is x, every angle at the intersection is either x or 180° − x. Angles in a triangle sum to 180°; an exterior angle = the sum of the two opposite interior angles."],
["Pythagoras' theorem: hypotenuse² = base² + height² in a right triangle.","Missing side = √(hyp² − known side²).","Pythagorean triplets to learn: (3, 4, 5), (5, 12, 13), (8, 15, 17), (7, 24, 25), (9, 40, 41), (20, 21, 29), plus their multiples, e.g. (6, 8, 10)."],
["Trigonometric ratios compare sides of a right triangle: sin = P/H, cos = B/H, tan = P/B (P = perpendicular/opposite, B = base/adjacent).","Draw the triangle from the given ratio (P = 3, H = 5), find the third side with Pythagoras (B = 4), then read off any ratio.","Identities: sin² + cos² = 1; tan = sin/cos; 1 + tan² = sec². Values: sin 30° = 1/2, sin 45° = 1/√2, sin 60° = √3/2, tan 45° = 1, tan 60° = √3."],
["The interior angles of an n-sided polygon sum to (n − 2) × 180°.","Each interior angle of a regular polygon = (n − 2) × 180/n. Each exterior angle = 360/n. Interior + exterior = 180°.","Reverse question: if each exterior angle is 40°, n = 360/40 = 9. Diagonals = n(n − 3)/2 (hexagon: 9). Pentagon interior angle = 108°, octagon = 135°."],
["Heights and distances use tan = height/distance for angles of elevation (looking up) or depression (looking down).","Height = distance × tan θ. tan 30° = 1/√3, tan 45° = 1, tan 60° = √3.","At 45°, height = distance. If the elevation changes from 30° to 60° as you walk d metres towards the tower, the height = d√3/2. Angle of depression from A to B = angle of elevation from B to A."],
["Circle formulas: circumference = 2πr, area = πr².","Get r from the circumference (r = C/2π), then the area. Shortcut: area = C²/(4π) = 88² × 7/88 = 616.","With π = 22/7, choose r as a multiple of 7. Semicircle perimeter = πr + 2r. Sector area = θ/360 × πr²; arc length = θ/360 × 2πr."],
["Rectangle: perimeter = 2(l + b), area = l × b.","Write the sides from the ratio (5x, 3x), use the perimeter to find x, then multiply.","Diagonal = √(l² + b²). If the length and breadth each increase by a% and b%, the area changes by a + b + ab/100 percent. Square: perimeter 4a, area a², diagonal a√2."],
["3D volumes: cylinder πr²h, cone ⅓πr²h, sphere ⁴⁄₃πr³, hemisphere ⅔πr³, cuboid lbh, cube a³.","Plug in the values; with π = 22/7 and r a multiple of 7, the 7 cancels neatly.","Surface areas: cylinder curved 2πrh, total 2πr(r + h); sphere 4πr²; cone curved πrl with l = √(r² + h²). 1 m³ = 1000 litres."],
["Melting and recasting keeps the volume the same.","Number of small pieces = big volume ÷ small volume. For spheres: (R/r)³. For wire from a sphere: πr²h = ⁴⁄₃πR³.","Ratios: volume scales with the cube of the length and surface area with the square. Doubling the radius → 8 × volume, 4 × area."],
["A square's diagonal = side × √2.","Side = diagonal/√2 = 10. Perimeter = 4a; area = a² = diagonal²/2.","Area directly from the diagonal: d²/2 = 200/2 = 100 m². Rhombus area = d₁ × d₂/2. A square is a rhombus with equal diagonals."],
["Mean = sum/count. Median = middle value of the sorted data. Mode = most frequent value.","Add carefully (here 56), then divide by the count (9). For an odd n, median = the (n+1)/2-th value; for an even n, the average of the two middle values.","Empirical relation: mode ≈ 3 median − 2 mean. Range = max − min. Always re-add the data: this question's original answer was wrong because of an addition slip."],
["For an arithmetic progression, the mean equals the middle term (or the average of the first and last terms).","With 5 equally spaced terms, the 3rd term (x + 4) equals the mean, 11.","Mean of the first n natural numbers = (n + 1)/2. If every value increases by k, the mean increases by k; if every value is multiplied by k, the mean is multiplied by k."],
["A pie chart is 360° for 100%, so 1% = 3.6°.","Percentage = angle/360 × 100 = angle/3.6. Value = angle/360 × total.","Reverse: 25% = 90°, 30% = 108°, 20% = 72°, 10% = 36°. For bar and line graphs, read the scale carefully and compute % changes from the base value."],
["Probability = favourable outcomes ÷ total outcomes, a value between 0 and 1.","List the outcomes for one die (1–6). Primes: 2, 3, 5 (1 is not prime). Even: 2, 4, 6. Multiple of 3: 3, 6.","Two dice: 36 outcomes. Sum 7 has the most ways (6). A pack of cards: 52 cards, 4 suits, 12 face cards, 4 aces. P(not A) = 1 − P(A)."],
["'At least one' is easiest done with the complement: 1 − P(none).","Two coins: P(no heads) = P(TT) = 1/4 → at least one head = 3/4.","n coins: total outcomes 2ⁿ; P(at least one head) = 1 − 1/2ⁿ. Exactly k heads = C(n, k)/2ⁿ. Three coins: 8 outcomes, exactly two heads = 3/8."]
);

L.push(
["Analogy questions test a relationship: worker : workplace, tool : user, cause : effect, part : whole, and so on.","Name the relationship of the first pair in a short sentence ('a Station Master works at a station'), then apply the same sentence to the second pair.","Common pairs: Doctor : Hospital, Teacher : School, Pilot : Cockpit, Chef : Kitchen. Watch the direction: if the first pair is worker → place, the answer must also be a place, not a tool."],
["Number analogies use a simple operation: square, cube, n² ± 1, n × k, sum of digits and so on.","Test in order: n², n³, n² ± n, n × constant. 8 → 64 = 8². Apply the same operation: 11² = 121.","Learn squares to 30 and cubes to 20. If n² doesn't fit, try n² + 1, n² − 1 or (n + 1)²."],
["Letter analogies shift letters by fixed steps through the alphabet.","Convert letters to positions (A = 1 … Z = 26). Find the shift for each letter (B 2 → E 5 = +3) and apply the same shifts.","Remember EJOTY = 5, 10, 15, 20, 25 as anchors. Opposite letter = 27 − position (A ↔ Z, M ↔ N). Shifts wrap around: Y + 3 = B."],
["Odd-one-out (classification) groups items by a shared property and finds the one that breaks it.","Name the category for each item (units: mass, mass, mass, length, mass). The one with a different category is the answer.","Units of mass: mg, g, kg, quintal (100 kg), tonne (1000 kg). Length: mm, cm, m, km. Always look for the most specific common property."],
["In odd-pair questions, most pairs follow one rule and one pair breaks it.","Find the rule from the first two pairs (13 → 169 = 13²), then check every pair exactly. 21² = 441 ≠ 442.","Traps are deliberate near-misses (441 vs 442). Check the rule both ways: n², n² + 1, n³, prime → next prime."],
["Number series follow one of a few patterns: constant difference, changing difference, ×k + c, squares/cubes, alternating series.","Step 1: write the differences. Step 2: if they aren't constant, compare ratios. Here 11/5 ≈ 2: test ×2 + 1 (5 → 11 → 23 → 47 → 95 → 191).","Common series patterns: ×2 + 1, ×2 − 1, ×3 + 1, n² ± 1, primes, Fibonacci-like (each term = sum of the previous two). If the differences grow fast, think multiplication."],
["Some series use products like n(n + 1) or n² + n.","Differences: 4, 6, 8, 10, 12 rise by 2 each time (a second-order constant), so the next difference is 14 → 42 + 14 = 56.","Spot n(n + 1): 2, 6, 12, 20, 30, 42, 56, 72, 90. Similar: n² − 1 = 0, 3, 8, 15, 24; n³ + 1 = 2, 9, 28, 65."],
["Letter-pair series move each letter position independently.","Split the pairs into a first-letter series (A, C, E, G → +2 → I) and a second-letter series (Z, X, V, T → −2 → R).","Many letter series combine a forward and a backward sequence. Convert to numbers if unsure: Z = 26, X = 24, V = 22, T = 20 → 18 = R."],
["When the differences themselves form a pattern (here they double), you have a 'difference series'.","Differences: 5, 10, 20, 40 → ×2 → next 80. Equivalent rule: term × 2 + 2 (3 → 8 → 18 → 38 → 78 → 158).","If the first differences aren't constant, write the second differences. Some series alternate operations: ×2, +3, ×2, +3."],
["Alternating series interleave two (or more) separate sequences.","Split by position: odd positions 7, 8, 9, … and even positions 10, 11, 12, … The next term is position 7 (odd) → 10.","Suspect an alternating series when the values go up and down. Each sub-series may follow a different rule (e.g. +1 and ×2)."],
["Coding-decoding questions use a rule: shift, reverse, opposite letter, position numbers or substitution.","Compare the word and its code letter by letter: S ↔ H, I ↔ R, G ↔ T, N ↔ M, A ↔ Z, L ↔ O. Each pair adds to 27, so it's the opposite letter. Apply the rule to the new word.","Opposite pairs to remember: A–Z, B–Y, C–X, D–W, E–V, F–U, G–T, H–S, I–R, J–Q, K–P, L–O, M–N. Also check whether the code is the word reversed before or after shifting."],
["Number codes often use alphabet positions, joined together or summed.","Write the positions: E5 N14 G7 … Joined together they form the code. Do the same for the new word: D4 A1 T20 A1 → 41201.","Variants: reverse positions (27 − n), position × 2, sum of positions, or the product of first and last letters. Test a short letter to confirm the rule."],
["Word-value codes often equal the sum of the letters' positions.","RED: 18 + 5 + 4 = 27 ✓. BLUE: 2 + 12 + 21 + 5 = 40 ✓. GREEN: 7 + 18 + 5 + 5 + 14 = 49.","If the sum doesn't fit, try: sum × number of letters, sum of reversed positions, or sum ± number of letters. Always check the rule against both examples."],
["In substitution (name-swap) coding, objects are renamed. Answer with the code name of the real object.","Ask what the true answer is (birds fly in the sky), then replace it with its code word ('sky' is called 'wall').","Trap: don't answer with the real word ('sky') or apply the substitution twice. Read 'X is called Y' carefully: X is the real thing, Y is its new name."],
["Direct letter-to-digit codes give each letter a fixed digit.","Build a lookup table from the examples: T 3, R 7, A 6, C 5, K 1, I 9, L 8. Confirm shared letters agree (R = 7 and A = 6 in both words). Read off the new word.","If a letter appears in two example words with different digits, the code is position-based, not letter-based. Watch for letters missing from the table."],
["Blood-relation statements are solved by breaking them into small pieces from the end.","Decode from the innermost phrase: 'my mother's only son' = me (Suresh, male speaker). 'His son' = my son. So Suresh is the father.","Draw a family tree with symbols: + male, − female, = couple, a vertical line for a generation. 'Only son of my father/mother' = the speaker (if male)."],
["Coded relations use symbols for relations; translate each symbol step by step.","P × Q → P is Q's father. Q + R → brothers/siblings. R − S → R is S's sister. So Q, R, S are siblings and P is the father of all.","The gender of the last person is often unknown, so the answer must work either way (father works; 'son' or 'daughter' may not). Draw a tree before choosing."],
["Family-tree puzzles combine several facts about one family.","Mark generations. A and B are brothers (gen 1). A's son is D's brother → D is A's child. C is D's sister → also A's child. B is the brother of their father → uncle.","Relation vocabulary: father's brother = paternal uncle, mother's brother = maternal uncle, brother's wife = sister-in-law, son's wife = daughter-in-law."],
["In-law chains usually shorten: 'my mother-in-law's only daughter' = my wife (for a married man).","Replace the phrase: the woman's mother = my wife → the woman is my daughter → I am her father.","Learn: 'my father's only son' = me, 'my mother's husband' = my father, 'my wife's brother' = my brother-in-law, 'my son's sister' = my daughter (if I have no other children)."],
["Gender clues decide son vs daughter, brother vs sister.","If Q is P's child and not a son, Q must be a daughter.","Gender traps: 'child' or 'sibling' doesn't tell you the gender, so look for he/she/son/sister clues before choosing."],
["Direction problems: draw each move on paper as a path, then measure the final position against the start.","Track x (East +, West −) and y (North +, South −). +10E, +5N, −10W → (0, 5) → 5 m North.","Left turn from East = North; left from North = West. Right turn = 90° clockwise, left = 90° anticlockwise, about-turn = 180°."],
["Shortest distance from the start is a straight line, found with Pythagoras.","Net displacement (6 S, 8 W) → √(6² + 8²) = 10 km. Facing South, a right turn means facing West.","Direction of the end point: South-West here. Common triplets: (3, 4, 5), (6, 8, 10), (5, 12, 13)."],
["Rotated-compass problems: if one known direction maps to a new one, the whole compass rotates by the same angle.","Normally 12 = North and 3 = East (90° clockwise from 12). If 12 now points West, the clock has turned 90° anticlockwise, so 3 points North.","Method: find how far the known pointer has turned, then turn every other direction by the same amount. Clock fact: at 3:00 the hands are 90° apart."],
["Relative direction: place points on a grid and compare coordinates.","B = (0, 0); A = (0, 5) North; C = (5, 0) East. From C to A: x decreases (West), y increases (North) → North-West.","Answer from the second point's view: 'A with respect to C' means stand at C and look at A. Swapping them gives the opposite direction (South-East)."],
["To find the final facing direction, track only the turns, not the distances.","Start North. Right → East. Right → South. Left → East.","Each right turn adds 90° clockwise, each left subtracts 90°. Count net turns: R, R, L = one net right turn from North = East."],
["Syllogisms test what must be true from statements. Use Venn diagrams with the least overlap that still fits.","'All A are B' = circle A inside B. 'All B are C' = B inside C, so A is inside C: 'all A are C'. Also 'some C are B' follows because B exists inside C.","Conversion: 'All A are B' → 'Some B are A' (always valid). 'Some A are B' ↔ 'Some B are A'. 'No A is B' ↔ 'No B is A'."],
["'Some' plus 'No' always gives a definite 'some … not' conclusion.","Some E are M; no M is B → the part of E that is M is outside B → 'Some E are not B'. 'Some motors are engines' is just the conversion of statement 1.","Rule: Some + No = 'Some not' (in that order). 'No' + 'Some' in the other order gives 'Some (second) are not (first)'."],
["When two terms have no definite relation, look for a complementary pair: 'some' and 'no' about the same two terms.","Computers ⊂ laptops; some laptops are tablets. Computers and tablets are not linked, so neither conclusion is certain. But one of 'some' or 'no' must be true, so 'either I or II' follows.","Either-or needs: the same subject and predicate, one 'Some', one 'No' (or 'All' with 'Some not'), and neither following on its own."],
["'All' + 'No' gives a definite 'No' conclusion.","Red ⊂ Blue, Blue ∩ Green = ∅ → Red ∩ Green = ∅ ('No red is green'). 'All red are blue' converts to 'Some blue are red'.","Pattern: All A are B + No B is C → No A is C, and Some C are not A. Draw a quick Venn diagram to confirm."],
["Two 'some' statements never give a definite conclusion about the end terms.","Some pens are pencils, some pencils are erasers. Pens and erasers may or may not overlap, so 'some pens are erasers' is not certain. 'All erasers are pencils' isn't supported either.","Rule: Some + Some = no conclusion. Some + All = Some. All + All = All. Check possibility questions separately: 'Some pens being erasers is a possibility' would follow."],
["Linear seating: place fixed clues first (middle seat, ends), then relative clues.","5 seats facing North: C at 3. A immediately left of C = seat 2. E at the right end = seat 5. B not next to E → seat 1. D takes seat 4.","Facing North: left = your left. Facing South: left and right reverse. 'Immediate' means directly adjacent; 'to the left' alone may mean anywhere to the left."],
["Circular seating facing the centre: your right is anticlockwise, your left is clockwise.","Fix P. Put S opposite. Q sits immediately on one side of P, R on the other (R must be next to P and T). T goes next to R. U fills the gap. Find Q's opposite seat.","With 6 seats, opposite = 3 seats away. Facing outward, the directions reverse. Draw a circle with seat numbers 1–6."],
["Ranking: position from top + position from bottom = total + 1.","Bottom rank = total − top rank + 1 = 40 − 13 + 1 = 28.","Total = top + bottom − 1. Number of people between two ranks = difference − 1. With two people swapping places, track both rank changes."],
["Order comparisons: chain the inequalities into one line.","A > B and A < C → C > A > B. D < B and D > E → B > D > E. Combined: C > A > B > D > E.","If two pieces can't be joined (no common person), the order is only partly known, so the answer may be 'cannot be determined'."],
["Turn each comparison into an inequality and merge them.","W > X. Z < X. Y < Z. Combine: W > X > Z > Y.","Translate carefully: 'Y is lighter than Z' → Y < Z. Writing the heaviest-to-lightest chain from left to right avoids sign errors."],
["Venn diagram classification: decide for each pair whether they are separate, overlapping or one inside the other.","Engineers vs IT professionals: overlap. Both inside Humans: a big circle containing two intersecting circles.","Quick rules: subset → one circle inside another; partly shared → overlapping; unrelated → separate. Example: Doctors, Women, Mothers → doctors overlap women; mothers are inside women and overlap doctors."],
["Two-set counting uses inclusion–exclusion.","n(M ∪ H) = 30 + 25 − 10 = 45. Neither = total − union = 5.","Only Marathi = 30 − 10 = 20; only Hindi = 15. Three sets: n(A∪B∪C) = A + B + C − AB − BC − CA + ABC."],
["Classification diagrams: decide which groups are subsets, overlap or are disjoint.","Dogs and Cats: disjoint (separate). Pets: some dogs and some cats are pets (overlap with each).","Not all dogs are pets (strays), so the circles only overlap rather than sit inside Pets. This is the 'two circles each cutting a third' pattern."],
["Inclusion–exclusion counts each person once: A + B − both.","18 + 15 − 6 = 27 play at least one game. Only cricket = 12; only football = 9.","If the total is given, 'neither' = total − 27. Use a two-circle diagram, filling the overlap first."],
["Subset relations plus unrelated groups give the 'circle in circle plus separate circle' diagram.","Snakes ⊂ Reptiles; Birds are neither reptiles nor snakes → a separate circle.","Similar: Fruits, Mangoes, Vegetables. Animal classes: mammals, birds, reptiles, amphibians and fish are separate groups."],
["Symbol-substitution questions replace operators; apply BODMAS after substituting.","Rewrite carefully: ÷ → +, − → ×, + → ÷, × → −. So 16 + 8 × 4 ÷ 2 − 5. Do × and ÷ left to right: 8 × 4 = 32, ÷ 2 = 16. Then 16 + 16 − 5 = 27.","Write the substituted expression on paper; most mistakes come from doing it in your head. Apply BODMAS only after substituting."],
["Sign-interchange questions: try each swap and evaluate with BODMAS.","Swap + and −: 10 − 4 + 2 × 3 = 6 + 6 = 12 ✓. Check the others to be sure.","Speed trick: estimate first and skip swaps that clearly overshoot or undershoot. Swapping × or ÷ changes the result most."],
["Statement-and-conclusion questions: a conclusion must follow from the statement alone, without extra assumptions.","The rule covers regular employees only. X's status is unknown, so 'X gets leave' doesn't definitely follow. 'X may be temporary' is a possibility consistent with the facts.","Words like 'may', 'possibly' and 'some' make possibility conclusions acceptable. Absolute words ('all', 'always', 'definitely') need full proof."],
["Inserting signs to make an equation true: test likely combinations, and remember BODMAS changes the order.","The last * must be '=', so the left side 7 ? 5 ? 2 must equal 17. 7 + 5 × 2 = 17 ✓ (× before +).","Look for the '=' position first (usually before the last number). Then test + and × combinations."],
["Custom operators (★) hide a simple formula combining the two numbers.","Test common formulas on both examples: a + b, a × b, 2(a + b), a² + b, a² − b², a × b + a … 2(5 + 3) = 16 ✓, 2(7 + 2) = 18 ✓.","The formula must fit every example. If two formulas fit the first, the second example settles it."],
["Counting triangles: count systematically by size.","Single regions: the diagonals divide the square into 4 small triangles. Combinations: each diagonal splits the square into 2 large triangles (2 diagonals × 2 = 4). Total 8.","Formulas: a triangle with lines from one vertex to n points on the opposite side gives n(n+1)/2 triangles. Label the points and list the triangles to avoid double counting."],
["Mirror images: a vertical mirror (left or right side) reverses left-right but keeps top-bottom. A water image (mirror below) reverses top-bottom.","For a word with the mirror on the right: the reflection reads in reverse order and each letter is laterally inverted.","Letters that look the same in a vertical mirror: A, H, I, M, O, T, U, V, W, X, Y. Clock mirror time = 11:60 − the actual time (e.g. 3:15 → 8:45)."],
["Dice questions: on a standard die, opposite faces add up to 7 (1–6, 2–5, 3–4).","Opposite of n = 7 − n. For non-standard dice, use the 'two positions of the same die' rule: the face that appears in neither position next to the common face is opposite it.","Adjacent faces can never be opposite. The four faces next to any face are adjacent to it; the remaining one is opposite."],
["Figure series often follow number patterns: squares, triangular numbers, +2 each step.","Dots 1, 4, 9, 16 are perfect squares (1², 2², 3², 4²), so next is 5² = 25.","Triangular numbers: 1, 3, 6, 10, 15. Rotation series: 45° or 90° per step. Look for counts of sides, dots and lines changing step by step."],
["Paper folding and punching: each fold doubles the layers, so each hole is repeated across all layers.","Two folds → 4 layers. 2 holes × 4 = 8 holes, placed symmetrically about the fold lines.","For position questions, unfold one fold at a time, mirroring the holes across each fold line in reverse order."]
);

L.push(
["The 7 SI base units: metre (length), kilogram (mass), second (time), ampere (current), kelvin (temperature), mole (amount of substance), candela (luminous intensity).","Derived units come from base units: coulomb = ampere × second, volt = W/A, ohm = V/A (Ohm's law V = IR), watt = J/s.","Instruments: ammeter (current, in series), voltmeter (voltage, in parallel), galvanometer (detects small currents). 1 kWh = 3.6 × 10⁶ J (one 'unit' of electricity)."],
["Newton's laws: 1st, inertia (a body stays at rest or in motion unless a force acts on it). 2nd, F = ma (force = rate of change of momentum). 3rd, action = reaction.","Identify the law from examples. A passenger jerks forward when a bus brakes → 1st law. Pushing a heavier object needs more force → 2nd law. Rocket propulsion, recoil of a gun, swimming → 3rd law.","Action and reaction act on different bodies, so they never cancel. Momentum p = mv; conservation of momentum also explains gun recoil. 1 newton = 1 kg·m/s²."],
["Mirror types: concave (converging) and convex (diverging). The image depends on where the object sits relative to the focus.","Concave uses: headlights and torches (source at the focus gives a parallel beam), shaving and dental mirrors (magnified image when the object is inside the focus), solar furnaces. Convex uses: rear-view mirrors and street mirrors (wide field of view, small upright image).","Mirror formula 1/f = 1/v + 1/u, with f = R/2. A plane mirror forms a virtual, erect image of the same size, laterally inverted."],
["Lens power measures how strongly a lens bends light: P = 1/f, with f in metres.","Convex (converging) lens: positive power. Concave (diverging) lens: negative power. Lenses in contact: P = P₁ + P₂.","Eye defects: myopia (near-sighted) is corrected with a concave lens; hypermetropia (far-sighted) with a convex lens; presbyopia with bifocals. Example: f = 50 cm → P = +2 D."],
["Refraction is the bending of light as it changes speed between media. Atmospheric layers act as a varying medium.","Effects of atmospheric refraction: twinkling stars, sunrise seen about 2 minutes early and sunset about 2 minutes late, the flattened Sun at the horizon.","Planets don't twinkle because they are extended sources. Scattering is different: it explains the blue sky (Rayleigh, short wavelengths scatter more) and red sunsets."],
["Gravity gives every falling body the same acceleration g (ignoring air resistance).","g = GM/R² ≈ 9.8 m/s². Weight W = mg (newtons); mass stays the same everywhere.","g is greatest at the poles and lowest at the equator, decreases with height and depth, and is 0 at Earth's centre. Moon's g ≈ g/6. Escape velocity from Earth = 11.2 km/s."],
["Measuring instruments are a common GK area. Match each instrument to the quantity it measures.","Barometer: air pressure. Hygrometer: humidity. Anemometer: wind speed. Manometer: gas pressure. Hydrometer: liquid density. Thermometer: temperature. Seismograph: earthquakes. Altimeter: altitude. Ammeter: current.","Others: lactometer (milk purity), sphygmomanometer (blood pressure), pyrometer (very high temperatures), odometer (distance), tachometer (rpm). A falling barometer reading signals stormy weather."],
["Refraction makes objects in water look shallower or bent.","Light from the submerged part bends away from the normal as it leaves water (denser) for air (rarer), so the image appears raised. Snell's law: n₁ sin θ₁ = n₂ sin θ₂.","Same effect: a pool looks shallower than it is (real depth/apparent depth = n ≈ 1.33). Refractive index n = c/v; glass ≈ 1.5, diamond ≈ 2.42."],
["Visible light is a small band of the electromagnetic spectrum, about 400–700 nm.","VIBGYOR from shortest to longest wavelength: violet, indigo, blue, green, yellow, orange, red. Frequency and energy increase as wavelength decreases (c = fλ).","Order of the EM spectrum by wavelength (short to long): gamma, X-rays, UV, visible, infrared, microwaves, radio. A prism disperses violet the most; red is used for danger signals because it scatters least and travels furthest."],
["Electromagnetic induction (Faraday): a changing magnetic flux induces an EMF.","Transformer: AC in the primary → changing flux in the iron core → EMF in the secondary. Vs/Vp = Ns/Np. Step-up: more secondary turns; step-down: fewer.","Transformers work only with AC (DC gives no changing flux). Power is ideally the same: VpIp = VsIs. A laminated core reduces eddy-current loss. Generators also use induction; motors use the force on a current-carrying conductor."],
["Common names of compounds are a staple GK topic.","Learn them in groups: salts (NaCl common salt, NaHCO₃ baking soda, Na₂CO₃·10H₂O washing soda, CaOCl₂ bleaching powder), calcium compounds (CaCO₃ limestone/marble, CaO quicklime, Ca(OH)₂ slaked lime).","Others: KNO₃ saltpetre, CuSO₄·5H₂O blue vitriol, FeSO₄·7H₂O green vitriol, NaOH caustic soda, H₂O₂ hydrogen peroxide, dry ice = solid CO₂."],
["pH measures acidity on a 0–14 scale: pH = −log[H⁺]. Below 7 is acidic, 7 neutral, above 7 basic.","Each pH unit is a 10× change in [H⁺]. Pure water at 25 °C: [H⁺] = [OH⁻] = 10⁻⁷ mol/L → pH 7.","Typical values: gastric juice ~1.5–3.5, lemon ~2.2, vinegar ~3, blood ~7.4, baking soda ~8.3, milk of magnesia ~10. Tooth decay begins below pH 5.5."],
["Common gas names and uses come up often.","N₂O laughing gas (anaesthetic), CH₄ marsh gas, CO₂ dry ice when solid, CO from incomplete combustion (toxic, binds haemoglobin), LPG mainly butane + propane, CNG mainly methane.","Others: noble gases (He, Ne, Ar, Kr, Xe, Rn) are inert. Neon is used in signs, argon in bulbs, helium in balloons and diving tanks. Ozone (O₃) blocks UV. Methyl isocyanate caused the Bhopal tragedy."],
["Sodium compounds are easy to mix up.","Baking soda NaHCO₃ (sodium bicarbonate): antacid, baking powder (with tartaric acid). Washing soda Na₂CO₃·10H₂O: removes the hardness of water. Caustic soda NaOH: soap making.","On heating: 2NaHCO₃ → Na₂CO₃ + H₂O + CO₂ (the CO₂ makes cakes rise). Solvay process makes Na₂CO₃. Chlor-alkali process gives NaOH + Cl₂ + H₂."],
["Abundance in the Earth's crust (by mass): O > Si > Al > Fe > Ca > Na > K > Mg.","Most abundant element: oxygen (~46%). Most abundant metal: aluminium (~8%). In the atmosphere: nitrogen (78%), then oxygen (21%), argon (0.93%).","Aluminium ore: bauxite. Iron ore: haematite and magnetite. Most abundant element in the universe: hydrogen. In the human body: oxygen."],
["Corrosion is the oxidation of metal. Rusting of iron needs both oxygen and water (moisture).","Galvanisation: a zinc coat protects iron. Zinc is more reactive, so it corrodes first (sacrificial protection). Other methods: painting, oiling, alloying (stainless steel with Cr and Ni), tin plating, cathodic protection.","Rust = hydrated iron(III) oxide, Fe₂O₃·xH₂O. Silver tarnishes black (Ag₂S); copper turns green (basic copper carbonate). Vulcanisation = adding sulphur to harden rubber."],
["Tests for common gases come up often.","CO₂ turns lime water milky: Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O. Excess CO₂ clears it again (soluble Ca(HCO₃)₂ forms). O₂ relights a glowing splint. H₂ burns with a 'pop'. NH₃ turns red litmus blue.","Cl₂ bleaches moist litmus. SO₂ decolourises acidified KMnO₄. CO₂ puts out fire, which is why it is used in extinguishers."],
["Fuels by main component: natural gas and CNG (methane CH₄), LPG (butane + propane), biogas (CH₄ ~55–75% + CO₂).","Biogas comes from the anaerobic digestion of cow dung and waste. Methane is the simplest alkane (CₙH₂ₙ₊₂ with n = 1).","An odorant (ethyl mercaptan) is added to LPG so leaks can be smelled. Coal gas = H₂ + CH₄ + CO. Producer gas = CO + N₂. Water gas = CO + H₂. Calorific value of hydrogen is the highest."],
["Natural acids appear in food and the body.","Stomach: hydrochloric acid. Vinegar: acetic acid. Lemon/orange: citric acid. Tamarind: tartaric acid. Tomato: oxalic acid. Curd: lactic acid. Ant/bee sting: formic (methanoic) acid. Apple: malic acid.","Antacids (Mg(OH)₂, NaHCO₃) neutralise excess stomach acid. Aqua regia = 3 HCl : 1 HNO₃ (dissolves gold). Sulphuric acid is the 'king of chemicals'."],
["Calcium sulphate exists as gypsum (dihydrate) and Plaster of Paris (hemihydrate).","Heat gypsum CaSO₄·2H₂O at ~373 K → CaSO₄·½H₂O (PoP). Add water and PoP sets back into hard gypsum.","PoP is used for fracture casts, statues and false ceilings, and must be stored dry. Heating above 473 K gives dead burnt plaster (anhydrous CaSO₄), which doesn't set."],
["Cell organelles and their functions are standard GK.","Mitochondria: ATP by aerobic respiration (powerhouse; has its own DNA). Ribosome: protein synthesis. Golgi: packaging and secretion. Lysosome: digestion ('suicide bag'). Nucleus: control centre. Chloroplast: photosynthesis (plants).","Endoplasmic reticulum: rough (with ribosomes, proteins) and smooth (lipids). The cell wall (cellulose) is found in plants only. The cell was discovered by Robert Hooke (1665)."],
["ABO blood groups depend on antigens on red blood cells and antibodies in plasma.","Group A: A antigen, anti-B antibody. Group B: B antigen, anti-A. AB: both antigens, no antibodies → universal recipient. O: no antigens, both antibodies → universal donor (O negative is the ideal donor).","Rh factor: Rh⁺ has the D antigen. An Rh⁻ mother carrying an Rh⁺ baby risks erythroblastosis fetalis. Blood groups were discovered by Karl Landsteiner."],
["Endocrine glands release hormones into the blood.","Pituitary (master gland): growth hormone, TSH, ACTH, FSH/LH. Thyroid: thyroxine (needs iodine; lack causes goitre). Adrenal: adrenaline (fight or flight). Pancreas: insulin (lowers sugar) and glucagon. Pineal: melatonin.","The hypothalamus controls the pituitary. The thyroid is the largest endocrine gland. Insulin deficiency causes diabetes. Excess growth hormone causes gigantism; deficiency causes dwarfism."],
["Vitamin deficiency diseases are frequently asked.","A: night blindness. B1 (thiamine): beriberi. B3 (niacin): pellagra. B12: pernicious anaemia. C (ascorbic acid): scurvy. D (calciferol): rickets in children, osteomalacia in adults. E: reproductive problems. K: poor blood clotting.","Fat-soluble vitamins: A, D, E, K (stored in the body). Water-soluble: B and C. Citrus fruits are rich in vitamin C; cooking destroys it."],
["Photosynthesis turns light energy into chemical energy: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (with light and chlorophyll).","Light reaction (thylakoids): water splits and releases O₂ and ATP/NADPH. Dark reaction / Calvin cycle (stroma): fixes CO₂ into glucose.","Chlorophyll contains magnesium. It absorbs red and blue light and reflects green. Oxygen released in photosynthesis comes from water, not CO₂."],
["Normal human vital signs are a common topic.","Heart rate 60–100 bpm (average 72). Blood pressure 120/80 mmHg. Body temperature 37 °C (98.6 °F). Breathing 12–20 breaths/min. Blood volume ~5–6 L.","Below 60 bpm is bradycardia; above 100 is tachycardia. The SA node is the heart's natural pacemaker. The heart has 4 chambers; William Harvey described circulation."],
["Blood has plasma (~55%) and formed elements: RBCs, WBCs and platelets.","RBCs: carry O₂ via haemoglobin (iron); no nucleus in humans; live ~120 days; made in bone marrow. WBCs: immunity. Platelets: clotting.","The spleen is the 'graveyard of RBCs'. Anaemia = low haemoglobin. Normal haemoglobin: men 13–17 g/dL, women 12–15 g/dL. Lymphocytes make antibodies."],
["Excretory system: the kidneys filter blood. Each kidney has about a million nephrons.","Nephron: glomerulus (filtration) → tubule (reabsorption of water, glucose and salts) → collecting duct → urine. Main waste: urea (made in the liver).","Dialysis is an artificial kidney. Kidney stones are commonly calcium oxalate. ADH (vasopressin) controls water reabsorption. The functional unit of the lung is the alveolus; of the nervous system, the neuron."],
["Vitamin D is made in the skin when UVB light converts 7-dehydrocholesterol.","Vitamin D helps the body absorb calcium and phosphorus, which build strong bones.","Deficiency: rickets (children), osteomalacia (adults). Sources: sunlight, fish liver oil, egg yolk. Known as the 'sunshine vitamin'."],
["Skeletal system facts: adults have 206 bones; babies have about 300 (some fuse).","Largest/longest/strongest: femur. Smallest: stapes (in the ear). Longest in the arm: humerus. The skull has 22 bones; the vertebral column 33 (26 in adults after fusion).","The hardest substance in the body is tooth enamel. Joints: ball-and-socket (shoulder, hip), hinge (knee, elbow), pivot (neck). Ligaments join bone to bone; tendons join muscle to bone."],
["Indian Railways history: the first train ran on 16 April 1853 from Bori Bunder (Bombay) to Thane, 34 km, with 14 coaches, hauled by Sahib, Sindh and Sultan.","Remember related firsts: first in East India, Howrah–Hooghly (1854); first in South India, Royapuram–Wallajah Road (1856); first electric train, Bombay VT–Kurla (3 February 1925).","Lord Dalhousie is called the 'father of Indian Railways'. Railways were nationalised in 1951. The Railway Board was set up in 1905. The Railway Budget merged with the Union Budget in 2017."],
["Indian Railways is run by the Ministry of Railways through the Railway Board (Rail Bhavan, New Delhi).","The Railway Board has a Chairman & CEO and members. Zones are headed by General Managers; divisions by Divisional Railway Managers (DRMs).","Indian Railways is one of the largest employers in the world. RDSO (Lucknow) is the research arm. IRCTC handles catering and e-ticketing. CRIS develops the IT systems."],
["Indian Railways' zones are its top administrative units, each headed by a General Manager.","As of 2026 there are 18 zones, including Metro Railway Kolkata. The newest is South Coast Railway (HQ Visakhapatnam), operational from 1 June 2026, carved out of East Coast and South Central Railways.","Learn the zone headquarters: Central — Mumbai CSMT; Western — Mumbai Churchgate; Konkan Railway is a separate PSU, not a zone. Largest zone by route length: Northern Railway."],
["Production units make rolling stock, so learn each unit and its location.","Coaches: ICF Chennai (Perambur), RCF Kapurthala, MCF Rae Bareli. Locomotives: BLW Varanasi (formerly DLW), CLW Chittaranjan, PLW Patiala. Wheels and axles: RWF Bengaluru, RWP Bela (Bihar).","ICF was founded in 1955 and built Train 18 / Vande Bharat. LHB coaches (German design) are built at RCF, ICF and MCF. Electric loco factory in Madhepura (with Alstom)."],
["Railway gauges are the distance between the inner faces of the rails.","Broad gauge 1,676 mm (5 ft 6 in), metre gauge 1,000 mm, narrow gauge 762 mm (2 ft 6 in) and 610 mm (2 ft). Standard gauge 1,435 mm is used by metros and abroad.","Project Unigauge converts lines to broad gauge. Konkan Railway is broad gauge. The Darjeeling Himalayan Railway is 610 mm narrow gauge."],
["Railway heritage institutions are common GK questions.","National Rail Museum: Chanakyapuri, New Delhi (opened 1977). Regional museums: Mysuru, Chennai, Howrah, Nagpur.","The Fairy Queen (1855) is the world's oldest working steam locomotive in regular service and is kept at the Rewari Steam Loco Shed."],
["Platform records change over time, so learn the current holder.","Hubballi Junction (Karnataka), Platform 1, about 1,507 m, is the world's longest railway platform (Guinness, 2023). Earlier record: Gorakhpur (about 1,366 m).","Other records: busiest station, Howrah. Highest station, Ghum (DHR). Longest rail tunnel: Pir Panjal (11.2 km) and T-50 on the USBRL (12.77 km). Highest rail bridge: Chenab."],
["The 'Mountain Railways of India' are a UNESCO World Heritage site with three parts.","Darjeeling Himalayan Railway (1999, 610 mm), Nilgiri Mountain Railway (2005, metre gauge rack railway), Kalka–Shimla Railway (2008, 762 mm). Matheran Hill Railway is on the tentative list.","Railway-related UNESCO site: Chhatrapati Shivaji Maharaj Terminus (CSMT), Mumbai (2004). DHR loops include the Batasia Loop. The Nilgiri line uses an Abt rack system."],
["Vande Bharat is India's indigenous semi-high-speed train with distributed traction (no separate locomotive).","Project name Train 18 (2018). Built at ICF Chennai. First run: New Delhi–Varanasi, 15 February 2019. Design speed 180 km/h; operating speed up to 160 km/h where track permits.","Variants: Vande Bharat sleeper, Vande Metro (renamed Namo Bharat Rapid Rail). Gatimaan Express was India's first 160 km/h train (with a locomotive)."],
["India's metro history: Kolkata had the first metro, and it is now an Indian Railways zone.","Kolkata Metro opened on 24 October 1984 (Esplanade–Bhowanipore). Delhi Metro opened in December 2002 (Shahdara–Tis Hazari, DMRC under E. Sreedharan).","India's first underwater metro tunnel is in Kolkata, under the Hooghly (2024). Kolkata Metro became the 17th zone in 2010."],
["Konkan Railway Corporation Ltd is a Government of India PSU (now a Schedule 'A' company) under the Ministry of Railways, separate from the zonal system.","Incorporated 19 July 1990. Construction began 15 October 1990. First train on the full route 26 January 1998. Dedicated to the nation on 1 May 1998.","KRCL was built on a BOT (build-operate-transfer) model with funds raised through bonds. It is mainly single line, with doubling under way. Its route runs through the Western Ghats coastline."],
["Leaders of the Konkan Railway project are often asked about.","Dr E. Sreedharan was the first Chairman & Managing Director (CMD) and is known as the 'Metro Man' (later Delhi Metro chief). George Fernandes, as Railway Minister, championed the project.","Sreedharan awards: Padma Shri (2001), Padma Vibhushan (2008). He also rebuilt the Pamban bridge in 46 days (1964)."],
["Konkan Railway's route connects Mumbai to Mangaluru along the west coast.","It runs from Roha (Raigad district, Maharashtra) to Thokur (near Mangaluru, Karnataka), about 741 km across three states: Maharashtra (~382 km), Goa (~105 km) and Karnataka (~254 km).","Major stations: Ratnagiri, Sawantwadi, Madgaon, Karwar, Udupi. Kerala is a shareholder although the line does not enter Kerala."],
["KRCL's offices are spread across the route.","Corporate office: Belapur Bhavan, CBD Belapur, Navi Mumbai. Regional offices: Ratnagiri and Karwar.","Don't confuse KRCL's headquarters with Central Railway's (CSMT Mumbai) or Western Railway's (Churchgate)."],
["Konkan Railway's terrain needed huge viaducts and tunnels.","Panval Nadi viaduct (near Ratnagiri): about 64 m pier height, about 424 m long, once Asia's tallest railway viaduct. Other major bridges: Sharavati (longest on KR, ~2 km, Honnavar), Zuari, Mandovi.","Konkan Railway has about 2,000 bridges and about 91 tunnels. India's tallest railway bridge now is Chenab (359 m above the river), on the USBRL in J&K, opened 2025."],
["Konkan Railway has about 91 tunnels through the Sahyadri and coastal laterite.","Karbude tunnel (~6.5 km, near Ratnagiri) is the longest on KR. Other long ones: Nathuwadi (~4.3 km), Tike (~4 km), Berdewadi (~3.4 km).","Tunnelling through soft, wet laterite was a major engineering challenge. Pir Panjal (11.2 km, J&K) was long India's longest railway tunnel."],
["Ro-Ro (Roll-on/Roll-off) loads fully loaded trucks onto flat wagons.","Konkan Railway started Ro-Ro in January 1999 (Kolad–Verna, extended to Surathkal). It saves diesel, cuts road congestion and shortens journey times through the ghats.","Truck drivers ride along in a coach. Ro-Ro is a KRCL speciality question. FOIS = Freight Operations Information System."],
["KRCL's ownership is shared between the centre and four states.","Shareholders: Ministry of Railways (largest), Maharashtra, Karnataka, Goa and Kerala.","Kerala holds shares even though the line ends at Thokur. Recent proposals discuss merging KRCL with Indian Railways."],
["Electrification of the Konkan route was a major recent milestone.","Work began in November 2015. The whole Roha–Thokur route (about 740 km) was completed in March 2022 at a cost of about ₹1,287 crore and dedicated to the nation in June 2022. It uses 25 kV AC traction.","Benefits: about ₹150 crore a year saved on fuel and lower emissions. Indian Railways' 'Mission 100% Electrification' targets the whole broad-gauge network."],
["Goa's major rivers are crossed by Konkan Railway bridges.","Mandovi (North Goa, near Panaji) and Zuari (South Goa, near Vasco/Cortalim) are the two main estuaries. Madgaon is Goa's main KR station.","Other rivers on the KR route: Savitri, Vashishti (Chiplun), Shastri, Sharavati (Honnavar, the longest KR bridge), Kali (Karwar), Netravati (Mangaluru)."]
);
